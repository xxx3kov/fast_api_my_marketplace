services:

  db:
    image: postgres:16
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER:  ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d flask_aiohttp" ]
      interval: 10s
      timeout: 5s
      retries: 5